server.port=8082
logging.level.root=info
spring.application.name=inventory-service

spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/swagger-ui.html

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

jwt.secret=change-this-to-a-long-random-secret-at-least-32-chars-for-hs256

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:default-placeholder}
cloudinary.api-key=${CLOUDINARY_API_KEY:default-placeholder}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:default-placeholder}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB